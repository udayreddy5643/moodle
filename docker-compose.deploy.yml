version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodle-cynaris-web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    environment:
      - MOODLE_DOCKER_DBTYPE=${MOODLE_DOCKER_DBTYPE:-mariadb}
      - MOODLE_DOCKER_DBHOST=db
      - MOODLE_DOCKER_DBNAME=${MOODLE_DOCKER_DBNAME:-moodle}
      - MOODLE_DOCKER_DBUSER=${MOODLE_DOCKER_DBUSER:-moodle}
      - MOODLE_DOCKER_DBPASS=${MOODLE_DOCKER_DBPASS:-m@0dl3ing}
      - MOODLE_DOCKER_DBCOLLATION=utf8mb4_unicode_ci
      - MOODLE_DOCKER_WEB_HOST=${MOODLE_DOCKER_WEB_HOST:-localhost}
      - MOODLE_DOCKER_WEB_PORT=${PORT:-8000}
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      - db

  db:
    image: mariadb:11.4
    container_name: moodle-cynaris-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=512M
    environment:
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=m@0dl3ing
      - MYSQL_ROOT_PASSWORD=m@0dl3ing_root
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  moodledata:
  dbdata:
